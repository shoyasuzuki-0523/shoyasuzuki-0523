  .value { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #38bdae; }
  .small { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9b1d6; }
  .fade { animation: fadeIn .6s ease-in-out backwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
